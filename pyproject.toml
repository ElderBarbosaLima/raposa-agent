[project]
name = "raposa-agent"
version = "0.1.0"
description = "An opinionated football agent for Cruzeiro fans: tool use, retrieval and evals on top of the Claude API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elder Lima" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
raposa-sync = "raposa.data.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raposa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word lists read better as a split string

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
